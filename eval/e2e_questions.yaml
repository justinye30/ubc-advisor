# End-to-end eval: 50 questions through the whole pipeline
# (classify → extract → handler → compose → guard).
#   40 answerable (including 2 where the right answer is "which course?")
#   10 that the system should decline
#
# Written before the first run. Freeze every prompt, then measure; the
# pipeline version printed by the runner changes if any prompt, schema, or
# model changes.
#
# Answerable questions carry GOLD INPUTS, not expected answers:
#   intent       the correct route
#   targets      the course(s) the question is about
#   have         what the student said they've passed ("CPSC 110, MATH 226:72")
#   in_progress  courses they said they're taking
#   year         year standing, if stated
# The runner feeds the gold inputs to the same deterministic handlers and
# checks that the pipeline, reading the English question, reached the same
# result. Whether the handlers themselves are right against the calendar is
# spot-checked with --audit (Week 1 measured the core separately).
#
# Optional checks:
#   status       expected handler status (needs_clarification, requirements_only…)
#   candidates   for clarifications: courses that must be offered
#   pages        for policy: a cited source URL must end with one of these
#   mentions     phrases the answer must contain ("six|6" = either)
#
# Declines carry `decline: true` and, optionally, the expected route.
# None of these questions reuse wording from the routing, extraction, or
# composer eval sets, and none share course codes with prompt examples.

# ------------------------------------------------ eligibility, history given
