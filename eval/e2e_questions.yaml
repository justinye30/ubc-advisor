- id: q38
  # Checked by hand: the Lower-level Requirements page has no such cap (it
  # covers the lab-science, additional-course and foundational requirements),
  # so the corpus can't answer this. The right behaviour is to say so, scoped
  # to the sections retrieved — not to characterize the whole calendar.
  question: Is there a cap on how many first-year courses count toward a BSc?
  intent: policy
  # Either phrasing is right: "the sections I found don't mention a cap", or
  # naming the degree-wide caps and saying they aren't specific to first year.
  mentions: ["don't mention|doesn't mention|does not mention|no cap|not specifically|not specific to"]

