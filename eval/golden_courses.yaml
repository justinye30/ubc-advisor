             - {op: OUT_OF_SCOPE, code: "STAT_O 121", reason: okanagan}
             - {op: OUT_OF_SCOPE, code: "STAT_O 203", reason: okanagan}
             - {op: OUT_OF_SCOPE, code: "STAT_O 205", reason: okanagan}
