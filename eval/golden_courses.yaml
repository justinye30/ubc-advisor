- code: "CPSC 320"
  text: "All of (a) CPSC_V 221 or DSCI_V 221, (b) at least 3 credits from MATH_V or STAT_V at 200 level or above or MATH_O 200, MATH_O 220, MATH_O 222, MATH_O 225, MATH_O 307, STAT_O 121, STAT_O 203, STAT_O 205, STAT_O 230, STAT_O 303 or any course on the STAT_V 200 credit exclusion: https://vancouver.calendar.ubc.ca/faculties-colleges-and-schools/facult… or HES_O 340, HMKN_O 205, POLI_O 400, PSYO_O 271, STAT_O 124"
  ambiguous: true
  note: >
    Scope of "at least 3 credits" is unclear — it may govern only the
    MATH_V/STAT_V clause, or the entire following enumeration. Two defensible
    readings produce different trees.
  tree:
    op: ALL_OF
    children:
      - op: ONE_OF
        children:
          - {op: COURSE, code: "CPSC 221", tracked: true}
          - {op: COURSE, code: "DSCI 221", tracked: true}
      - op: ONE_OF
        children:
          - op: MIN_CREDITS
            credits: 3
            from:
              subjects: ["MATH", "STAT"]
              level_min: 200
          - op: ONE_OF
            children:
             - {op: OUT_OF_SCOPE, code: "MATH_O 200", reason: okanagan}
